<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300">
  <rect width="360" height="300" fill="#0f1115"/>
  <text x="180" y="28" text-anchor="middle" fill="#e8eaed" font-size="13" font-family="system-ui,sans-serif" font-weight="600">Triangle ABC (vector sides)</text>
  <!-- triangle A bottom-left, B bottom-right, C top -->
  <polygon points="60,240 300,240 180,60" fill="none" stroke="#e8eaed" stroke-width="2"/>
  <!-- arrows AB, BC, AC -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6ea8ff"/>
    </marker>
  </defs>
  <line x1="70" y1="240" x2="280" y2="240" stroke="#6ea8ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="230" x2="190" y2="80" stroke="#c4a35a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="70" y1="230" x2="170" y2="80" stroke="#7dd3c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="50" y="260" fill="#e8eaed" font-size="16" font-family="system-ui,sans-serif" font-weight="700">A</text>
  <text x="300" y="260" fill="#e8eaed" font-size="16" font-family="system-ui,sans-serif" font-weight="700">B</text>
  <text x="172" y="50" fill="#e8eaed" font-size="16" font-family="system-ui,sans-serif" font-weight="700">C</text>
  <text x="170" y="270" text-anchor="middle" fill="#6ea8ff" font-size="12" font-family="system-ui,sans-serif">AB</text>
  <text x="260" y="140" fill="#c4a35a" font-size="12" font-family="system-ui,sans-serif">BC</text>
  <text x="90" y="140" fill="#7dd3c0" font-size="12" font-family="system-ui,sans-serif">AC</text>
</svg>
