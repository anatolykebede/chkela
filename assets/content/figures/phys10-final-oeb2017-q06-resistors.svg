<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320">
  <rect width="560" height="320" fill="#0f1115"/>
  <g fill="none" stroke="#e8eaed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- left terminal A -->
    <line x1="40" y1="160" x2="80" y2="160"/>
    <line x1="80" y1="70" x2="80" y2="250"/>
    <!-- upper branch left parallel group -->
    <line x1="80" y1="70" x2="120" y2="70"/>
    <line x1="120" y1="40" x2="120" y2="100"/>
    <!-- three parallel resistors zigzag -->
    <path d="M120,40 L140,40 L145,32 L155,48 L165,32 L175,48 L185,32 L195,40 L220,40"/>
    <path d="M120,70 L140,70 L145,62 L155,78 L165,62 L175,78 L185,62 L195,70 L220,70"/>
    <path d="M120,100 L140,100 L145,92 L155,108 L165,92 L175,108 L185,92 L195,100 L220,100"/>
    <line x1="220" y1="40" x2="220" y2="100"/>
    <line x1="220" y1="70" x2="260" y2="70"/>
    <!-- 20 ohm series -->
    <path d="M260,70 L280,70 L285,62 L295,78 L305,62 L315,78 L325,62 L335,70 L360,70"/>
    <line x1="360" y1="70" x2="420" y2="70"/>
    <line x1="420" y1="70" x2="420" y2="160"/>
    <!-- lower branch -->
    <line x1="80" y1="250" x2="120" y2="250"/>
    <line x1="120" y1="220" x2="120" y2="280"/>
    <path d="M120,220 L140,220 L145,212 L155,228 L165,212 L175,228 L185,212 L195,220 L220,220"/>
    <path d="M120,280 L140,280 L145,272 L155,288 L165,272 L175,288 L185,272 L195,280 L220,280"/>
    <line x1="220" y1="220" x2="220" y2="280"/>
    <line x1="220" y1="250" x2="260" y2="250"/>
    <!-- 6 ohm -->
    <path d="M260,250 L280,250 L285,242 L295,258 L305,242 L315,258 L325,242 L335,250 L360,250"/>
    <line x1="360" y1="250" x2="420" y2="250"/>
    <line x1="420" y1="250" x2="420" y2="160"/>
    <!-- to B -->
    <line x1="420" y1="160" x2="500" y2="160"/>
  </g>
  <text x="28" y="166" fill="#7dd3c0" font-size="18" font-family="system-ui,sans-serif" font-weight="700">A</text>
  <text x="510" y="166" fill="#7dd3c0" font-size="18" font-family="system-ui,sans-serif" font-weight="700">B</text>
  <text x="155" y="28" fill="#9aa3ad" font-size="13" font-family="system-ui,sans-serif">8©</text>
  <text x="155" y="64" fill="#9aa3ad" font-size="13" font-family="system-ui,sans-serif">16©</text>
  <text x="155" y="118" fill="#9aa3ad" font-size="13" font-family="system-ui,sans-serif">16©</text>
  <text x="285" y="55" fill="#9aa3ad" font-size="13" font-family="system-ui,sans-serif">20©</text>
  <text x="155" y="208" fill="#9aa3ad" font-size="13" font-family="system-ui,sans-serif">9©</text>
  <text x="155" y="298" fill="#9aa3ad" font-size="13" font-family="system-ui,sans-serif">18©</text>
  <text x="290" y="235" fill="#9aa3ad" font-size="13" font-family="system-ui,sans-serif">6©</text>
</svg>
