<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220">
  <rect width="560" height="220" fill="#0f1115"/>
  <text x="280" y="24" text-anchor="middle" fill="#e8eaed" font-size="13" font-family="system-ui,sans-serif" font-weight="600">Correct Lewis formula?</text>
  <g font-family="system-ui,sans-serif" fill="#e8eaed" font-size="14">
    <text x="20" y="70">A. [Ca]⁺  [:F̈:]⁻</text>
    <text x="20" y="100">B. [:Ca]⁺  [:F̈:]⁻</text>
    <text x="20" y="130">C. [Na]⁻  [:F̈:]⁺</text>
    <text x="20" y="160">D. [Na]⁺  [:F̈:]⁻</text>
  </g>
  <text x="280" y="200" text-anchor="middle" fill="#9aa3ad" font-size="12" font-family="system-ui,sans-serif">Na⁺ with F⁻ (complete octet) is correct</text>
</svg>
