<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
  <rect width="480" height="360" fill="#0f1115"/>
  <text x="240" y="24" text-anchor="middle" fill="#e8eaed" font-size="14" font-family="system-ui,sans-serif" font-weight="600">Water cycle</text>
  <!-- sun -->
  <circle cx="400" cy="60" r="22" fill="#c4a35a"/>
  <!-- clouds -->
  <ellipse cx="200" cy="70" rx="50" ry="22" fill="#3d4a5c"/>
  <ellipse cx="100" cy="90" rx="55" ry="28" fill="#5a6575"/>
  <!-- rain D -->
  <g stroke="#6ea8ff" stroke-width="2">
    <line x1="80" y1="120" x2="70" y2="160"/><line x1="100" y1="120" x2="90" y2="160"/><line x1="120" y1="120" x2="110" y2="160"/>
  </g>
  <text x="130" y="150" fill="#6ea8ff" font-size="16" font-family="system-ui,sans-serif" font-weight="700">D</text>
  <!-- A condensation arrow between clouds -->
  <path d="M160,70 Q180,50 200,65" fill="none" stroke="#9aa3ad" stroke-width="2" marker-end="url(#arr)"/>
  <text x="185" y="48" fill="#9aa3ad" font-size="14" font-family="system-ui,sans-serif">A</text>
  <!-- land + tree -->
  <rect x="40" y="250" width="180" height="50" fill="#2a4030"/>
  <line x1="100" y1="250" x2="100" y2="200" stroke="#7dd3c0" stroke-width="4"/>
  <ellipse cx="100" cy="185" rx="30" ry="25" fill="#3d6b4f"/>
  <!-- C transpiration -->
  <path d="M100,170 L100,130" fill="none" stroke="#7dd3c0" stroke-width="2"/>
  <text x="115" y="145" fill="#7dd3c0" font-size="14" font-family="system-ui,sans-serif" font-weight="700">C</text>
  <!-- water body -->
  <ellipse cx="340" cy="280" rx="100" ry="40" fill="#1a3a50" stroke="#6ea8ff" stroke-width="2"/>
  <text x="340" y="285" text-anchor="middle" fill="#9aa3ad" font-size="12" font-family="system-ui,sans-serif">Water body</text>
  <!-- B evaporation -->
  <path d="M340,240 L340,120" fill="none" stroke="#e85d75" stroke-width="2.5"/>
  <polygon points="340,115 334,130 346,130" fill="#e85d75"/>
  <text x="355" y="180" fill="#e85d75" font-size="16" font-family="system-ui,sans-serif" font-weight="700">B</text>
  <text x="240" y="345" text-anchor="middle" fill="#9aa3ad" font-size="12" font-family="system-ui,sans-serif">B = evaporation · D = precipitation</text>
</svg>
