<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="340" viewBox="0 0 320 340">
  <rect width="320" height="340" fill="#0f1115"/>
  <text x="160" y="24" text-anchor="middle" fill="#e8eaed" font-size="13" font-family="system-ui,sans-serif" font-weight="600">Hollow cylinder</text>
  <!-- outer ellipse top -->
  <ellipse cx="160" cy="70" rx="70" ry="22" fill="none" stroke="#c4a35a" stroke-width="2"/>
  <ellipse cx="160" cy="70" rx="20" ry="7" fill="none" stroke="#c4a35a" stroke-width="1.5"/>
  <!-- sides -->
  <line x1="90" y1="70" x2="90" y2="240" stroke="#c4a35a" stroke-width="2"/>
  <line x1="230" y1="70" x2="230" y2="240" stroke="#c4a35a" stroke-width="2"/>
  <line x1="140" y1="70" x2="140" y2="240" stroke="#c4a35a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="180" y1="70" x2="180" y2="240" stroke="#c4a35a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- bottom -->
  <ellipse cx="160" cy="240" rx="70" ry="22" fill="none" stroke="#c4a35a" stroke-width="2"/>
  <ellipse cx="160" cy="240" rx="20" ry="7" fill="none" stroke="#c4a35a" stroke-width="1.5"/>
  <!-- height -->
  <line x1="50" y1="70" x2="50" y2="240" stroke="#6ea8ff" stroke-width="1.5"/>
  <text x="28" y="160" fill="#6ea8ff" font-size="12" font-family="system-ui,sans-serif">6 cm</text>
  <!-- radii -->
  <line x1="160" y1="240" x2="230" y2="240" stroke="#e85d75" stroke-width="1.5"/>
  <text x="185" y="258" fill="#e85d75" font-size="11" font-family="system-ui,sans-serif">4 cm</text>
  <line x1="160" y1="240" x2="180" y2="240" stroke="#7dd3c0" stroke-width="2"/>
  <text x="155" y="280" fill="#7dd3c0" font-size="11" font-family="system-ui,sans-serif">r = 1 cm</text>
  <text x="160" y="320" text-anchor="middle" fill="#9aa3ad" font-size="12" font-family="system-ui,sans-serif">V = π(R² - r²)h</text>
</svg>
