<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="320" viewBox="0 0 340 320">
  <rect width="340" height="320" fill="#0f1115"/>
  <text x="170" y="24" text-anchor="middle" fill="#e8eaed" font-size="13" font-family="system-ui,sans-serif" font-weight="600">Intersecting chords</text>
  <circle cx="170" cy="170" r="110" fill="none" stroke="#e8eaed" stroke-width="2"/>
  <!-- A left, B top, C right, D bottom -->
  <g fill="#e8eaed" font-size="14" font-family="system-ui,sans-serif">
    <text x="48" y="175">A</text>
    <text x="162" y="55">B</text>
    <text x="278" y="175">C</text>
    <text x="162" y="298">D</text>
  </g>
  <line x1="60" y1="170" x2="280" y2="170" stroke="#6ea8ff" stroke-width="2"/>
  <line x1="170" y1="60" x2="170" y2="280" stroke="#c4a35a" stroke-width="2"/>
  <circle cx="170" cy="170" r="4" fill="#e85d75"/>
  <text x="178" y="165" fill="#e85d75" font-size="14" font-family="system-ui,sans-serif">E</text>
  <text x="170" y="312" text-anchor="middle" fill="#9aa3ad" font-size="11" font-family="system-ui,sans-serif">∠ADB = 34° · arc DC = 122°</text>
