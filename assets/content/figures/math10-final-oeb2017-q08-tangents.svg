<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300">
  <rect width="360" height="300" fill="#0f1115"/>
  <text x="180" y="24" text-anchor="middle" fill="#e8eaed" font-size="13" font-family="system-ui,sans-serif" font-weight="600">Two tangents from external point</text>
  <circle cx="140" cy="150" r="70" fill="none" stroke="#e8eaed" stroke-width="2"/>
  <circle cx="140" cy="150" r="3" fill="#6ea8ff"/>
  <text x="128" y="145" fill="#6ea8ff" font-size="14" font-family="system-ui,sans-serif">O</text>
  <!-- P top, Q bottom -->
  <circle cx="175" cy="92" r="3" fill="#e8eaed"/>
  <circle cx="175" cy="208" r="3" fill="#e8eaed"/>
  <text x="182" y="88" fill="#e8eaed" font-size="14" font-family="system-ui,sans-serif">P</text>
  <text x="182" y="225" fill="#e8eaed" font-size="14" font-family="system-ui,sans-serif">Q</text>
  <line x1="140" y1="150" x2="175" y2="92" stroke="#6ea8ff" stroke-width="1.5"/>
  <line x1="140" y1="150" x2="175" y2="208" stroke="#6ea8ff" stroke-width="1.5"/>
  <!-- T to the right -->
  <circle cx="280" cy="150" r="3" fill="#c4a35a"/>
  <text x="288" y="155" fill="#c4a35a" font-size="14" font-family="system-ui,sans-serif">T</text>
  <line x1="280" y1="150" x2="175" y2="92" stroke="#c4a35a" stroke-width="2"/>
  <line x1="280" y1="150" x2="175" y2="208" stroke="#c4a35a" stroke-width="2"/>
  <text x="180" y="280" text-anchor="middle" fill="#9aa3ad" font-size="12" font-family="system-ui,sans-serif">∠POQ = 110°</text>
</svg>
