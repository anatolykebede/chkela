<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <rect width="720" height="480" fill="#0f1115"/>
  <text x="360" y="32" text-anchor="middle" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Male reproductive organs (schematic)</text>

  <!-- body outline -->
  <path d="M210,90 C250,70 430,70 470,100 C500,130 520,220 510,300 C500,360 470,400 430,420 C390,440 300,450 250,430 C200,410 170,340 165,280 C160,210 175,120 210,90 Z" fill="#2a2430" stroke="#c4a090" stroke-width="2.5"/>

  <!-- bladder A -->
  <ellipse cx="340" cy="200" rx="70" ry="55" fill="#c43c3c" opacity="0.95"/>
  <text x="340" y="205" text-anchor="middle" fill="#fff" font-size="14" font-family="system-ui,sans-serif" font-weight="700">A</text>

  <!-- seminal vesicle B (behind/top-right of bladder) -->
  <ellipse cx="420" cy="155" rx="28" ry="20" fill="#5b7fd6"/>
  <text x="420" y="160" text-anchor="middle" fill="#fff" font-size="13" font-family="system-ui,sans-serif" font-weight="700">B</text>

  <!-- rectum C -->
  <path d="M470,180 C500,200 505,280 490,340 C480,370 460,390 450,400" fill="none" stroke="#a33" stroke-width="18" stroke-linecap="round"/>
  <circle cx="500" cy="250" r="14" fill="#2a2430"/>
  <text x="500" y="255" text-anchor="middle" fill="#ffb4b4" font-size="13" font-family="system-ui,sans-serif" font-weight="700">C</text>

  <!-- prostate D under bladder -->
  <ellipse cx="340" cy="265" rx="36" ry="18" fill="#c4a35a"/>
  <text x="340" y="270" text-anchor="middle" fill="#1a1a1a" font-size="13" font-family="system-ui,sans-serif" font-weight="700">D</text>

  <!-- vas deferens path -->
  <path d="M255,390 C240,320 250,250 300,230 C320,220 360,215 380,200" fill="none" stroke="#6ea8ff" stroke-width="4"/>

  <!-- epididymis E -->
  <ellipse cx="245" cy="375" rx="16" ry="12" fill="#7dd3c0"/>
  <text x="245" y="380" text-anchor="middle" fill="#0f1115" font-size="12" font-family="system-ui,sans-serif" font-weight="700">E</text>

  <!-- scrotum F -->
  <ellipse cx="255" cy="420" rx="42" ry="32" fill="none" stroke="#e0a090" stroke-width="3"/>
  <text x="300" y="445" fill="#e0a090" font-size="13" font-family="system-ui,sans-serif" font-weight="700">F</text>

  <!-- testis G -->
  <ellipse cx="255" cy="415" rx="24" ry="20" fill="#4a7fd4"/>
  <text x="255" y="420" text-anchor="middle" fill="#fff" font-size="13" font-family="system-ui,sans-serif" font-weight="700">G</text>

  <!-- urethra/penis H -->
  <rect x="160" y="285" width="90" height="22" rx="10" fill="#d4a090"/>
  <text x="175" y="275" fill="#e8eaed" font-size="13" font-family="system-ui,sans-serif" font-weight="700">H</text>

  <!-- pubic bone region I -->
  <path d="M200,230 L230,250 L210,270 Z" fill="#9aa3ad"/>
  <text x="190" y="225" fill="#e8eaed" font-size="13" font-family="system-ui,sans-serif" font-weight="700">I</text>

  <!-- legend -->
  <rect x="40" y="60" width="150" height="200" rx="10" fill="#1a1f27" stroke="#2a2f38"/>
  <text x="55" y="85" fill="#9aa3ad" font-size="12" font-family="system-ui,sans-serif">Key (selected)</text>
  <text x="55" y="110" fill="#e8eaed" font-size="12" font-family="system-ui,sans-serif">A Bladder</text>
  <text x="55" y="132" fill="#e8eaed" font-size="12" font-family="system-ui,sans-serif">B Seminal vesicle</text>
  <text x="55" y="154" fill="#e8eaed" font-size="12" font-family="system-ui,sans-serif">D Prostate</text>
  <text x="55" y="176" fill="#e8eaed" font-size="12" font-family="system-ui,sans-serif">E Epididymis</text>
  <text x="55" y="198" fill="#e8eaed" font-size="12" font-family="system-ui,sans-serif">F Scrotum</text>
  <text x="55" y="220" fill="#e8eaed" font-size="12" font-family="system-ui,sans-serif">G Testicle</text>
  <text x="55" y="242" fill="#e8eaed" font-size="12" font-family="system-ui,sans-serif">H Urethra / penis</text>
</svg>
