<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560">
  <rect width="420" height="560" fill="#0f1115"/>
  <text x="210" y="28" text-anchor="middle" fill="#e8eaed" font-size="14" font-family="system-ui,sans-serif" font-weight="600">Human skeleton (labels)</text>
  <!-- simplified stick skeleton -->
  <circle cx="210" cy="70" r="28" fill="none" stroke="#e8eaed" stroke-width="3"/>
  <line x1="210" y1="98" x2="210" y2="220" stroke="#e8eaed" stroke-width="4"/>
  <!-- clavicle -->
  <line x1="160" y1="110" x2="260" y2="110" stroke="#7dd3c0" stroke-width="4"/>
  <!-- arms / humerus right -->
  <line x1="260" y1="110" x2="300" y2="200" stroke="#6ea8ff" stroke-width="5"/>
  <line x1="160" y1="110" x2="120" y2="200" stroke="#e8eaed" stroke-width="4"/>
  <line x1="300" y1="200" x2="320" y2="280" stroke="#e8eaed" stroke-width="3"/>
  <line x1="120" y1="200" x2="100" y2="280" stroke="#e8eaed" stroke-width="3"/>
  <!-- pelvis -->
  <ellipse cx="210" cy="250" rx="45" ry="25" fill="none" stroke="#c4a35a" stroke-width="4"/>
  <!-- legs tibia left (our right for viewer left of skeleton = skeleton's right... use left leg as tibia label 43) -->
  <line x1="185" y1="270" x2="170" y2="380" stroke="#e85d75" stroke-width="5"/>
  <line x1="235" y1="270" x2="250" y2="380" stroke="#e8eaed" stroke-width="4"/>
  <line x1="170" y1="380" x2="165" y2="480" stroke="#e8eaed" stroke-width="3"/>
  <line x1="250" y1="380" x2="255" y2="480" stroke="#e8eaed" stroke-width="3"/>
  <!-- callouts -->
  <rect x="20" y="95" width="40" height="24" rx="4" fill="#2a3140" stroke="#7dd3c0"/><text x="40" y="112" text-anchor="middle" fill="#7dd3c0" font-size="12" font-weight="700" font-family="system-ui,sans-serif">41</text>
  <line x1="60" y1="107" x2="160" y2="110" stroke="#7dd3c0" stroke-width="1.5"/>
  <rect x="340" y="145" width="40" height="24" rx="4" fill="#2a3140" stroke="#6ea8ff"/><text x="360" y="162" text-anchor="middle" fill="#6ea8ff" font-size="12" font-weight="700" font-family="system-ui,sans-serif">42</text>
  <line x1="340" y1="157" x2="280" y2="155" stroke="#6ea8ff" stroke-width="1.5"/>
  <rect x="20" y="350" width="40" height="24" rx="4" fill="#2a3140" stroke="#e85d75"/><text x="40" y="367" text-anchor="middle" fill="#e85d75" font-size="12" font-weight="700" font-family="system-ui,sans-serif">43</text>
  <line x1="60" y1="362" x2="170" y2="340" stroke="#e85d75" stroke-width="1.5"/>
  <rect x="300" y="230" width="40" height="24" rx="4" fill="#2a3140" stroke="#c4a35a"/><text x="320" y="247" text-anchor="middle" fill="#c4a35a" font-size="12" font-weight="700" font-family="system-ui,sans-serif">44</text>
  <line x1="300" y1="242" x2="250" y2="250" stroke="#c4a35a" stroke-width="1.5"/>
  <text x="210" y="530" text-anchor="middle" fill="#9aa3ad" font-size="12" font-family="system-ui,sans-serif">42 humerus · 43 tibia</text>
</svg>
