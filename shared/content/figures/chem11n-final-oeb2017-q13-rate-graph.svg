<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360">
  <rect width="520" height="360" fill="#0f1115"/>
  <text x="260" y="28" text-anchor="middle" fill="#e8eaed" font-size="14" font-family="system-ui,sans-serif" font-weight="600">Volume of H₂ vs time</text>
  <!-- axes -->
  <line x1="70" y1="300" x2="480" y2="300" stroke="#9aa3ad" stroke-width="2"/>
  <line x1="70" y1="300" x2="70" y2="50" stroke="#9aa3ad" stroke-width="2"/>
  <text x="275" y="345" text-anchor="middle" fill="#9aa3ad" font-size="12" font-family="system-ui,sans-serif">t (s)</text>
  <text x="28" y="180" fill="#9aa3ad" font-size="12" font-family="system-ui,sans-serif" transform="rotate(-90 28 180)">V</text>
  <!-- x ticks -->
  <g fill="#9aa3ad" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="70" y="318">0</text>
    <text x="170" y="318">20</text>
    <text x="220" y="318">30</text>
    <text x="270" y="318">40</text>
    <text x="320" y="318">50</text>
  </g>
  <!-- curve -->
  <path d="M70,300 Q140,120 270,150 T420,130" fill="none" stroke="#e8eaed" stroke-width="2.5"/>
  <!-- tangent through (270,150) -->
  <line x1="120" y1="210" x2="380" y2="90" stroke="#6ea8ff" stroke-width="2"/>
  <!-- guide lines -->
  <g stroke="#c4a35a" stroke-width="1" stroke-dasharray="3 3">
    <line x1="170" y1="300" x2="170" y2="185"/>
    <line x1="220" y1="300" x2="220" y2="168"/>
    <line x1="270" y1="300" x2="270" y2="150"/>
    <line x1="320" y1="300" x2="320" y2="118"/>
  </g>
  <!-- y labels -->
  <g fill="#9aa3ad" font-size="11" font-family="system-ui,sans-serif" text-anchor="end">
    <text x="64" y="189">V₁</text>
    <text x="64" y="172">V₂</text>
    <text x="64" y="154">V₃</text>
    <text x="64" y="138">V₄</text>
    <text x="64" y="122">V₅</text>
  </g>
  <!-- points: V1 tangent@20, V2 tangent@30, V3@40, V4 curve@50, V5 tangent@50 -->
  <circle cx="170" cy="185" r="4" fill="#6ea8ff"/>
  <circle cx="220" cy="168" r="4" fill="#6ea8ff"/>
  <circle cx="270" cy="150" r="5" fill="#e85d75"/>
  <circle cx="320" cy="135" r="4" fill="#e8eaed"/>
  <circle cx="320" cy="118" r="4" fill="#6ea8ff"/>
  <text x="400" y="70" fill="#6ea8ff" font-size="12" font-family="system-ui,sans-serif">tangent at 40 s</text>
</svg>
