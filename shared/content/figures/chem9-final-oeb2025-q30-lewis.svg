    <text x="40" y="90">A. Na</text>
    <circle cx="85" cy="75" r="2.5" fill="#e8eaed"/><circle cx="85" cy="90" r="2.5" fill="#e8eaed"/>
    <text x="40" y="140" fill="#c4a35a" font-size="14" font-weight="700">A</text>
    <text x="160" y="90">B. Mg</text>
    <circle cx="210" cy="75" r="2.5" fill="#7dd3c0"/><circle cx="210" cy="90" r="2.5" fill="#7dd3c0"/>
    <text x="160" y="140" fill="#c4a35a" font-size="14" font-weight="700">B</text>
    <text x="280" y="90">C.</text>
    <circle cx="305" cy="75" r="2.5" fill="#e8eaed"/><circle cx="305" cy="90" r="2.5" fill="#e8eaed"/>
    <text x="320" y="90">Li</text>
    <circle cx="350" cy="82" r="2.5" fill="#e8eaed"/>
    <text x="280" y="140" fill="#c4a35a" font-size="14" font-weight="700">C</text>
    <text x="400" y="90">D.</text>
    <circle cx="425" cy="75" r="2.5" fill="#e8eaed"/><circle cx="425" cy="90" r="2.5" fill="#e8eaed"/>
    <text x="440" y="90">Be</text>
