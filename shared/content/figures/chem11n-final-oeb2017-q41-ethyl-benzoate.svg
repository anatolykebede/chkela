<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
  <rect width="640" height="200" fill="#0f1115"/>
  <text x="320" y="24" text-anchor="middle" fill="#e8eaed" font-size="13" font-family="system-ui,sans-serif" font-weight="600">Product of benzoic acid + ethanol</text>
  <!-- helper: benzene hex -->
  <!-- A: Ph-C(=O)-CH2CH3 -->
  <g transform="translate(20,50)" stroke="#e8eaed" stroke-width="1.8" fill="none">
    <polygon points="40,20 60,20 70,37 60,54 40,54 30,37"/>
    <line x1="70" y1="37" x2="95" y2="37"/>
    <line x1="95" y1="37" x2="95" y2="18"/>
    <text x="100" y="16" fill="#e8eaed" font-size="12" stroke="none">O</text>
    <line x1="95" y1="37" x2="120" y2="50"/>
    <line x1="120" y1="50" x2="145" y2="37"/>
  </g>
  <text x="95" y="175" text-anchor="middle" fill="#c4a35a" font-size="16" font-family="system-ui,sans-serif" font-weight="700">A</text>
  <!-- B: Ph-O-CH2CH3 -->
  <g transform="translate(180,50)" stroke="#e8eaed" stroke-width="1.8" fill="none">
    <polygon points="40,20 60,20 70,37 60,54 40,54 30,37"/>
    <line x1="70" y1="37" x2="90" y2="37"/>
    <text x="92" y="42" fill="#e8eaed" font-size="12" stroke="none">O</text>
    <line x1="108" y1="37" x2="130" y2="50"/>
    <line x1="130" y1="50" x2="155" y2="37"/>
  </g>
  <text x="255" y="175" text-anchor="middle" fill="#c4a35a" font-size="16" font-family="system-ui,sans-serif" font-weight="700">B</text>
  <!-- C: Ph-O-C(=O)-CH3 -->
  <g transform="translate(350,50)" stroke="#e8eaed" stroke-width="1.8" fill="none">
    <polygon points="40,20 60,20 70,37 60,54 40,54 30,37"/>
    <line x1="70" y1="37" x2="88" y2="37"/>
    <text x="90" y="42" fill="#e8eaed" font-size="12" stroke="none">O</text>
    <line x1="108" y1="37" x2="128" y2="37"/>
    <line x1="128" y1="37" x2="128" y2="18"/>
    <text x="133" y="16" fill="#e8eaed" font-size="12" stroke="none">O</text>
    <line x1="128" y1="37" x2="155" y2="37"/>
  </g>
  <text x="430" y="175" text-anchor="middle" fill="#c4a35a" font-size="16" font-family="system-ui,sans-serif" font-weight="700">C</text>
  <!-- D: Ph-C(=O)-O-CH2CH3 ethyl benzoate -->
  <g transform="translate(500,50)" stroke="#e8eaed" stroke-width="1.8" fill="none">
    <polygon points="30,20 50,20 60,37 50,54 30,54 20,37"/>
    <line x1="60" y1="37" x2="78" y2="37"/>
    <line x1="78" y1="37" x2="78" y2="18"/>
    <text x="83" y="16" fill="#e8eaed" font-size="12" stroke="none">O</text>
    <line x1="78" y1="37" x2="95" y2="37"/>
    <text x="97" y="42" fill="#e8eaed" font-size="12" stroke="none">O</text>
    <line x1="112" y1="37" x2="130" y2="50"/>
    <line x1="130" y1="50" x2="150" y2="37"/>
  </g>
  <text x="575" y="175" text-anchor="middle" fill="#c4a35a" font-size="16" font-family="system-ui,sans-serif" font-weight="700">D</text>
</svg>
